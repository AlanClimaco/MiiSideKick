<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiiSideKick Gadget</title>
  <link rel="stylesheet" href="/src/css/global.css" />
  <link rel="stylesheet" href="/src/css/gadget.css" />
</head>
<body class="gadget-body">
  <div class="gadget-container" data-tauri-drag-region>
    <!-- Header com área de arraste -->
    <div class="gadget-header" data-tauri-drag-region>
      <div class="gadget-title" data-tauri-drag-region>
        <img src="/src/assets/reacoes/mii-normal.png" alt="Mii" class="gadget-icon" data-tauri-drag-region />
        <span class="gadget-label" data-tauri-drag-region>Mii Gadget</span>
      </div>
      <button class="gadget-btn-close" id="btnFecharGadget" type="button" title="Ocultar Gadget" aria-label="Ocultar Gadget">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>

    <!-- Telemetria: CPU & RAM -->
    <div class="gadget-meters" data-tauri-drag-region>
      <!-- CPU -->
      <div class="meter-group">
        <div class="meter-info">
          <span class="meter-name">CPU</span>
          <span class="meter-val" id="cpuVal">0%</span>
        </div>
        <div class="meter-track">
          <div class="meter-fill cpu-fill" id="cpuBar" style="width: 0%;"></div>
        </div>
      </div>

      <!-- RAM -->
      <div class="meter-group">
        <div class="meter-info">
          <span class="meter-name">RAM</span>
          <span class="meter-val" id="ramVal">0%</span>
        </div>
        <div class="meter-track">
          <div class="meter-fill ram-fill" id="ramBar" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Ações Rápidas -->
    <div class="gadget-actions">
      <button class="gadget-action-btn" id="btnAcaoLixo" type="button" title="Esvaziar Lixeira e Limpar Cache">
        <span class="action-icon">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </span>
        <span class="action-text">Lixo</span>
      </button>
      <button class="gadget-action-btn" id="btnAcaoOrganizar" type="button" title="Organizar Downloads">
        <span class="action-icon">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span class="action-text">Organizar</span>
      </button>
      <button class="gadget-action-btn" id="btnAcaoOlharTela" type="button" title="Olhar Tela com IA">
        <span class="action-icon">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </span>
        <span class="action-text">Ver Tela</span>
      </button>
    </div>

    <!-- Status toast temporário -->
    <div class="gadget-status" id="gadgetStatus" style="display: none;"></div>
  </div>

  <script type="module" src="/src/gadget/gadget.ts"></script>
</body>
</html>

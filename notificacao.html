<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificação do Mii</title>
    <link rel="stylesheet" href="/src/css/global.css" />
    <link rel="stylesheet" href="/src/css/notificacao.css" />
</head>
<body class="notificacao-body">
    <button class="btn-fechar" id="fecharPopup" type="button" title="Fechar" aria-label="Fechar notificação">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>

    <div class="container" id="container">
        <div class="conteudo-mensagem">
            <div class="balao" id="balaoContainer">
                <div id="mensagem">Processando...</div>
                <div class="referencia-container" id="referenciaContainer" style="display: none;">
                    <button class="btn-link-referencia" id="btnLinkReferencia">
                        <span id="labelLinkReferencia">Documentação</span> ↗
                    </button>
                </div>
            </div>
            <button class="btn-responder" id="btnResponder" style="display: none;">Responder</button>
        </div>
        <img src="/src/assets/reacoes/mii-normal.png" class="mii" id="miiAvatar" alt="Mii">
    </div>
    
    <script type="module" src="/src/notificacao/notificacao.ts"></script>
</body>
</html>
